<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 640" font-family="Segoe UI, Arial, sans-serif">
  <rect width="1100" height="640" fill="#ffffff"/>
  <text x="40" y="42" fill="#1c1c1c" font-size="24">Схема: верность поручению, не гарантия</text>
  <text x="40" y="68" fill="#5e6670" font-size="14">Пост t.me/yury/1300, форум «Цифровые решения», 7 октября 2026</text>

  <rect x="370" y="100" width="360" height="64" rx="6" fill="#f6f4f0" stroke="#e4dfd6"/>
  <text x="550" y="126" fill="#1c1c1c" font-size="16" text-anchor="middle">Человек</text>
  <text x="550" y="148" fill="#5e6670" font-size="13" text-anchor="middle">замысел и ответственность</text>

  <rect x="370" y="196" width="360" height="64" rx="6" fill="#f6f4f0" stroke="#e4dfd6"/>
  <text x="550" y="222" fill="#1c1c1c" font-size="16" text-anchor="middle">Карточка поручения</text>
  <text x="550" y="244" fill="#5e6670" font-size="13" text-anchor="middle">цель, край, стоп, инструменты</text>

  <rect x="70" y="300" width="300" height="64" rx="6" fill="#f6f4f0" stroke="#e4dfd6"/>
  <text x="220" y="326" fill="#1c1c1c" font-size="16" text-anchor="middle">Исполнитель</text>
  <text x="220" y="348" fill="#5e6670" font-size="13" text-anchor="middle">соразмерное задаче</text>

  <rect x="730" y="300" width="300" height="64" rx="6" fill="#f6f4f0" stroke="#e4dfd6"/>
  <text x="880" y="326" fill="#1c1c1c" font-size="16" text-anchor="middle">Критик</text>
  <text x="880" y="348" fill="#5e6670" font-size="13" text-anchor="middle">не каждый шаг человеку</text>

  <line x1="550" y1="164" x2="550" y2="196" stroke="#1f4b6e" stroke-width="1.4"/>
  <line x1="470" y1="260" x2="220" y2="300" stroke="#1f4b6e" stroke-width="1.2"/>
  <line x1="630" y1="260" x2="880" y2="300" stroke="#1f4b6e" stroke-width="1.2"/>

  <rect x="40" y="410" width="1020" height="190" rx="6" fill="#ffffff" stroke="#e4dfd6"/>
  <text x="60" y="442" fill="#1f4b6e" font-size="14">Петля только в песочнице</text>
  <rect x="60" y="464" width="280" height="64" rx="6" fill="#f6f4f0" stroke="#e4dfd6"/>
  <text x="200" y="490" fill="#1c1c1c" font-size="15" text-anchor="middle">ИИ-1 строит цель</text>
  <text x="200" y="512" fill="#5e6670" font-size="12" text-anchor="middle">виртуальный банк</text>
  <rect x="410" y="464" width="280" height="64" rx="6" fill="#f6f4f0" stroke="#e4dfd6"/>
  <text x="550" y="490" fill="#1c1c1c" font-size="15" text-anchor="middle">ИИ-2 атакует</text>
  <text x="550" y="512" fill="#5e6670" font-size="12" text-anchor="middle">ищет выход за край</text>
  <rect x="760" y="464" width="280" height="64" rx="6" fill="#f6f4f0" stroke="#e4dfd6"/>
  <text x="900" y="490" fill="#1c1c1c" font-size="15" text-anchor="middle">ИИ-3 ловит атаку</text>
  <text x="900" y="512" fill="#5e6670" font-size="12" text-anchor="middle">правила обновляет человек</text>
  <text x="370" y="560" fill="#5e6670" font-size="16" text-anchor="middle">→</text>
  <text x="720" y="560" fill="#5e6670" font-size="16" text-anchor="middle">→</text>
</svg>
